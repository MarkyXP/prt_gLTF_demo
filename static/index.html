<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>.prt to glTF converter</title>
<link rel="stylesheet" href="/static/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="side">
  <h1>.prt &rarr; glTF converter</h1>
  <div id="drop">
    <input id="file" type="file" accept=".prt" multiple>
    <div id="dropmsg">Drag &amp; drop .prt file(s) here<br>or click to select one</div>
  </div>
  <div id="stats">Ready.</div>
  <progress id="progress" max="1" value="0" hidden></progress>
  <button id="reindex" type="button">Re-index assembly components</button>
  <div id="toggles">
    <label><input type="checkbox" id="tplace" checked> Show placeholder boxes</label>
    <label><input type="checkbox" id="ttranslucent" checked> See-through envelopes</label>
  </div>
  <div id="refs"></div>
  <a id="download" download>Download converted .glb</a>
  <div id="render"></div>
</div>
<div id="view">
  <div id="display-style">
    <div class="ds-row ds-title">Display style</div>
    <div class="ds-row">
      <label><input type="radio" name="display-style" id="style-shaded" checked> Shaded</label>
      <label><input type="radio" name="display-style" id="style-wireframe"> Wireframe</label>
    </div>
    <div class="ds-row">
      <label for="opacity-slider">Opacity</label>
      <span id="opacity-value">Auto</span>
    </div>
    <div class="ds-row">
      <input type="range" id="opacity-slider" min="0" max="100" value="100">
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
