<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>.prt to glTF converter</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #111; color: #ddd;
         display: flex; height: 100vh; }
  #side { width: 20rem; padding: 1rem; box-sizing: border-box; background: #181818;
          border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: .75rem; }
  h1 { font-size: 1.05rem; margin: 0; }
  #drop { border: 2px dashed #777; border-radius: .5rem; padding: 1.5rem .75rem;
          text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: #4a9; background: #1a2a1f; }
  #drop input { display: none; }
  #stats { font-size: .85rem; color: #9a9; min-height: 2.5em; }
  #progress { width: 100%; height: .55rem; accent-color: #4a9; }
  #refs .component.done { color: #8bd8c0; }
  #refs .component.active { color: #fff; font-weight: 600; }
  #reindex { padding: .4rem .6rem; border: 1px solid #777; border-radius: .35rem;
             background: #222; color: #ddd; cursor: pointer; }
  #reindex:hover { background: #2a2a2a; }
  #reindex:disabled { cursor: wait; opacity: .6; }
  #toggles { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; }
  #toggles label { display: flex; align-items: center; gap: .4rem; cursor: pointer;
                   user-select: none; }
  #refs { flex: 1; min-height: 0; font-size: .8rem; color: #aaa; overflow: auto; }
  #refs .missing { color: #f0a0a0; border: 1px solid #a44; border-radius: .25rem;
                  padding: .15rem .3rem; margin-top: .15rem; }
  #refs .child { margin-left: 1rem; }
  #download { display: none; text-decoration: none; padding: .4rem .6rem; border: 1px solid #4a9;
              border-radius: .35rem; text-align: center; }
  #download:hover { background: #1a2a1f; }
  #view { flex: 1; }
  canvas { display: block; }
  noscript, .warn { color: #a86; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="side">
  <h1>.prt &rarr; glTF converter</h1>
  <div id="drop">
    <input id="file" type="file" accept=".prt" multiple>
    <div id="dropmsg">Drag &amp; drop .prt file(s) here<br>or click to select one</div>
  </div>
  <div id="stats">Ready.</div>
  <progress id="progress" max="1" value="0" hidden></progress>
  <button id="reindex" type="button">Re-index assembly components</button>
  <div id="toggles">
    <label><input type="checkbox" id="tplace" checked> Show placeholder boxes</label>
    <label><input type="checkbox" id="ttranslucent" checked> See-through envelopes</label>
  </div>
  <div id="refs"></div>
  <a id="download" download>Download converted .glb</a>
  <div id="render"></div>
</div>
<div id="view"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const stats = document.getElementById('stats');
const progress = document.getElementById('progress');
const reindex = document.getElementById('reindex');
const dl = document.getElementById('download');
const renderNote = document.getElementById('render');
const refs = document.getElementById('refs');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151518);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
const view = document.getElementById('view');

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
view.appendChild(renderer.domElement);
new ResizeObserver(resize).observe(view);
resize();

scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x404040, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3, 6, 4);
scene.add(key);
scene.add(new THREE.GridHelper(50, 50, 0x444, 0x2a2a2a));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
camera.position.set(4, 3, 6);

const loader = new GLTFLoader();
let current, url;
let activeConversion;

// Assembly-proxy styling. GLTFLoader merges the per-mesh glTF `extras` into
// Mesh.userData (assignExtrasToUserData()), so every Mesh carries
// mesh.userData.proxyRole and each per-instance node clone keeps a deep copy
// of it. Proxy bodies are restyled and get a wireframe-outline child per mesh
// node; normal parts are never touched.
const chkPlaceholders = document.getElementById('tplace');
const chkEnvelopes = document.getElementById('ttranslucent');
const PROXY_EDGE_COLOR = {
  'translucent-bounds': 0x4a90d9,   // blue envelope outline
  'placeholder': 0xd98f4a,          // amber outline, body hidden
};
let styledProxies = [];
let styledEdges = [];   // scene-level LineSegments overlays with baked coords

// --- hidden-edge removal for the proxy envelopes ------------------------
// A proxy body is always an axis-aligned box, so each of its 12 edges is
// shared by exactly 2 faces with fixed outward normals. An edge is visible
// iff at least one of its two faces faces the camera (outward normal has
// a positive component towards the camera); edges between two back faces
// are the "hidden edges" a paper drawing would draw dashed.
function boxEdges(geometry) {
  geometry.computeBoundingBox();
  const bounds = geometry.boundingBox;
  if (!bounds || !(bounds.max.x - bounds.min.x > 0)) return null;
  const axes = ['x', 'y', 'z'];
  const lows = axes.map((a) => bounds.min[a]);
  const highs = axes.map((a) => bounds.max[a]);
  const corners = [];
  for (let index = 0; index < 8; index += 1) {
    corners.push(new THREE.Vector3(
      (index & 1) ? lows[0] : highs[0],
      (index & 2) ? lows[1] : highs[1],
      (index & 4) ? lows[2] : highs[2]));
  }
  // Edges of a cube: pairs of corners differing in exactly one axis. The
  // two adjacent faces are those fixed on that axis' high/low sides.
  const edges = [];
  for (let a = 0; a < corners.length; a += 1) {
    for (let b = a + 1; b < corners.length; b += 1) {
      const differing = [0, 1, 2].filter((axis) =>
        Math.abs(corners[a].getComponent(axis)
          - corners[b].getComponent(axis)) > 1e-12);
      if (differing.length !== 1) continue;
      const moving = differing[0];
      const faceAxis = (moving + 1) % 3;
      const otherAxis = (moving + 2) % 3;
      const faces = [faceAxis, otherAxis].map((axis) => {
        const normal = new THREE.Vector3();
        const side = corners[a].getComponent(axis)
          > lows[axis] + 1e-12 ? 1 : -1;
        normal.setComponent(axis, side);
        return normal;
      });
      edges.push({ a: corners[a], b: corners[b], faces: faces });
    }
  }
  if (edges.length !== 12) return null;
  return { corners, edges };
}

function addEdgeOverlay(mesh, color, checkEl) {
  if (!mesh.geometry || !mesh.geometry.attributes.position) return;
  let overlay;
  const box = boxEdges(mesh.geometry);
  if (box) {
    // Hidden-edge removal: only silhouette-visible edges are drawn, with
    // positions rewritten in world space each frame. The overlay is added
    // to the scene so its baked world coordinates stay authoritative.
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position',
      new THREE.BufferAttribute(new Float32Array(12 * 2 * 3), 3)
        .setUsage(THREE.DynamicDrawUsage));
    overlay = new THREE.LineSegments(
      geometry, new THREE.LineBasicMaterial({ color: color }));
    overlay.renderOrder = 1;
    overlay.frustumCulled = false;
    overlay.userData = {
      mesh: mesh,
      edges: box.edges,
      checked: checkEl,
    };
    styledEdges.push(overlay);
    scene.add(overlay);
  } else {
    overlay = new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry, 1),
      new THREE.LineBasicMaterial({ color: color }));
    overlay.name = mesh.name + ' wireframe';
    overlay.renderOrder = 1;
    mesh.add(overlay);
  }
}

function updateProxyEdges() {
  const cameraPosition = camera.position;
  const normalMatrix = new THREE.Matrix3();
  const point = new THREE.Vector3();
  const normal = new THREE.Vector3();
  for (const edgeData of styledEdges) {
    const data = edgeData.userData;
    if (!data) continue;
    data.mesh.updateMatrixWorld(true);
    const matrix = data.mesh.matrixWorld;
    normalMatrix.getNormalMatrix(matrix);
    const positions = edgeData.geometry.attributes.position.array;
    let count = 0;
    for (const edge of data.edges) {
      const visible = edge.faces.some((localNormal) => {
        normal.copy(localNormal).applyMatrix3(normalMatrix);
        point.copy(edge.a).applyMatrix4(matrix);
        return normal.dot(cameraPosition.clone().sub(point)) > 0;
      });
      if (!visible) continue;
      for (const corner of [edge.a, edge.b]) {
        point.copy(corner).applyMatrix4(matrix);
        positions[count * 3 + 0] = point.x;
        positions[count * 3 + 1] = point.y;
        positions[count * 3 + 2] = point.z;
        count += 1;
      }
    }
    edgeData.geometry.setDrawRange(0, count);
    edgeData.geometry.attributes.position.needsUpdate = true;
    edgeData.geometry.computeBoundingSphere();
  }
}

function styleProxies(root) {
  styledProxies = [];
  for (const overlay of styledEdges) scene.remove(overlay);
  styledEdges = [];
  const proxies = [];
  root.traverse((object) => {
    if (object.isMesh && object.userData && object.userData.proxyRole
        && object.userData.proxyRole in PROXY_EDGE_COLOR) {
      proxies.push(object);
    }
  });
  for (const mesh of proxies) {
    const role = mesh.userData.proxyRole;
    // GLTF material dedup can share one material object across proxy
    // instances (and in principle with non-proxy meshes); clone before
    // restyling so nothing else inherits these overrides.
    mesh.material = mesh.material.clone();
    if (role === 'placeholder') {
      mesh.material.visible = false;      // only the wireframe remains
    } else {
      mesh.material.transparent = true;   // faint see-through envelope
      mesh.material.opacity = 0.12;
      mesh.material.depthWrite = false;
      mesh.material.side = THREE.DoubleSide;
    }
    addEdgeOverlay(mesh, PROXY_EDGE_COLOR[role],
      role === 'placeholder' ? chkPlaceholders : chkEnvelopes);
    styledProxies.push({ mesh: mesh, role: role });
  }
}

function applyProxyVisibility() {
  for (const entry of styledProxies) {
    entry.mesh.visible = entry.role === 'placeholder'
      ? chkPlaceholders.checked
      : chkEnvelopes.checked;             // child wireframes hide with it
  }
  for (const overlay of styledEdges) {
    overlay.visible = overlay.userData.checked?.checked ?? true;
  }
}

chkPlaceholders.addEventListener('change', applyProxyVisibility);
chkEnvelopes.addEventListener('change', applyProxyVisibility);

function fitAndCenter(root) {
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);
  const dist = size * 1.6;
  camera.position.set(dist * 0.7, size * 0.5, dist * 0.7);
  camera.near = Math.max(size / 1000, 0.001);
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

function show(gltf, name) {
  if (current) scene.remove(current);
  current = gltf.scene || gltf.scenes[0];
  // GLTF BLEND materials are normally drawn after opaque geometry, but the
  // default depthWrite can still let a bounds proxy mask its recovered
  // components. Keep the proxy depth-tested while preventing depth-buffer
  // writes so it reads as context rather than as a solid replacement.
  current.traverse((object) => {
    if (!object.isMesh) return;
    const materials = Array.isArray(object.material)
      ? object.material : [object.material];
    for (const material of materials) {
      if (material && material.transparent) {
        material.depthWrite = false;
        material.needsUpdate = true;
      }
    }
  });
  styleProxies(current);
  fitAndCenter(current);
  scene.add(current);
  applyProxyVisibility();
  renderNote.textContent = '';
  url = URL.createObjectURL(gltf.source);   // the raw .glb blob
  dl.href = url;
  dl.download = name;
  dl.style.display = 'block';
}

renderer.setAnimationLoop(() => {
  controls.update();
  updateProxyEdges();
  renderer.render(scene, camera);
});

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => fileInput.files.length &&
  convert(Array.from(fileInput.files)));

reindex.addEventListener('click', () => {
  reindex.disabled = true;
  stats.textContent = 'Re-indexing assembly components...';
  fetch('/reindex', { method: 'POST' })
    .then(async (res) => {
      if (!res.ok) throw new Error('Re-index failed: ' + res.statusText);
      return res.json();
    })
    .then((result) => {
      stats.textContent = 'Indexed ' + result.file_count
        + ' .prt file(s) (' + result.unique_names + ' unique names).';
    })
    .catch((error) => { stats.textContent = String(error.message || error); })
    .finally(() => { reindex.disabled = false; });
});

drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('over');
  const files = Array.from(e.dataTransfer.files);
  if (files.length) convert(files);
});

function convert(files) {
  const file = files[0];
  const started = performance.now();
  let phaseStarted = started;
  activeConversion = { started: started, phaseStarted: phaseStarted };
  const setPhase = (label) => {
    phaseStarted = performance.now();
    activeConversion.phaseStarted = phaseStarted;
    stats.textContent = label + ' — step 0.0s, total 0.0s';
  };
  const updateTimer = () => {
    stats.textContent = stats.textContent.replace(
      / — step .*$/, ' — step ' + formatDuration(performance.now() - phaseStarted)
        + ', total ' + formatDuration(performance.now() - started));
  };
  const timer = setInterval(updateTimer, 250);
  const finish = (message) => {
    clearInterval(timer);
    stats.textContent = message;
  };
  setPhase('Finding referenced components');
  progress.hidden = false;
  progress.value = 0;
  progress.max = 1;
  refs.textContent = 'Finding referenced components...';
  dl.style.display = 'none';
  if (url) URL.revokeObjectURL(url);
  const lookup = new FormData();
  for (const part of files) lookup.append('files', part);
  fetch('/references', { method: 'POST', body: lookup })
    .then(async (res) => res.ok ? res.json() : null)
    .then(tree => { if (tree) renderReferences(tree); })
    .catch(() => { refs.textContent = ''; })
    .then(() => {
      setPhase('Converting on server');
      const form = new FormData();
      for (const part of files) form.append('files', part);
      return fetch('/convert', { method: 'POST', body: form });
    })
    .then(async (res) => {
      if (!res.ok) {
        let detail = res.statusText;
        try {
          const body = await res.json();
          detail = typeof body.detail === 'string'
            ? body.detail : JSON.stringify(body.detail || body);
        } catch (e) {}
        throw new Error('Conversion failed: ' + detail);
      }
      const job = await res.json();
      setPhase('Converting components');
      return waitForConversion(job.job_id);
    })
    .then(async (job) => {
      if (job.status === 'failed') {
        throw new Error('Conversion failed: ' + job.error);
      }
      setPhase('Loading converted model');
      const result = await fetch('/convert/' + job.job_id + '/result');
      if (!result.ok) throw new Error('Conversion result unavailable');
      const info = job.stats || {};
      const blob = new Blob([await result.arrayBuffer()], { type: 'model/gltf-binary' });
      const name = file.name.replace(/\.prt$/i, '') + '.glb';
      loader.load(
        URL.createObjectURL(blob),
        (gltf) => {
          gltf.source = blob;
          show(gltf, name);
          const timings = info.timings_ms || {};
          const serverSteps = ['prepare_ms', 'decode_ms', 'serialize_ms']
            .filter((key) => timings[key] !== undefined)
            .map((key) => key.replace('_ms', '') + ' '
              + formatDuration(timings[key])).join(', ');
          finish('"' + file.name + '" converted: '
            + info.meshes + ' mesh(es), ' + info.points + ' points, '
            + info.triangles + ' triangles. Total '
            + formatDuration(performance.now() - started)
            + ' (server ' + formatDuration(timings.total_ms || 0)
            + '; ' + serverSteps + ').'
            + (info.assemblies || []).map((assembly) => {
                          const found = assembly.resolved_count;
                          const total = assembly.reference_count;
                          if (assembly.proxy_display === 'placeholder')
                            return ' Assembly: ' + found + '/' + total
                              + ' components found; showing placeholder bounds.';
                          if (assembly.proxy_display === 'translucent-bounds')
                            return ' Assembly: ' + found + '/' + total
                              + ' direct components found; translucent bounds mark missing geometry.'
                              + (assembly.nested_missing_count
                                ? ' Nested assemblies are incomplete.' : '');
                          if (assembly.proxy_display === 'suppressed')
                            return ' Assembly: all ' + total
                              + ' components found; proxy bounds hidden.';
                          if (assembly.proxy_display === 'no-proxy'
                              && (assembly.missing_count
                                  || assembly.nested_missing_count))
                            return ' Assembly geometry included; '
                              + (assembly.missing_count + assembly.nested_missing_count)
                              + ' referenced components remain unresolved.';
                          return '';
                        }).join(''));
        },
        undefined,
        (err) => { finish('Conversion finished but three.js could not render: ' + err); }
      );
    })
    .catch((err) => { finish(String(err.message || err)); });
}

function formatDuration(milliseconds) {
  const seconds = milliseconds / 1000;
  return seconds < 10 ? seconds.toFixed(1) + 's' : seconds.toFixed(0) + 's';
}

function renderReferences(tree) {
  refs.replaceChildren();
  let count = 0;
  const add = (node, parent, depth) => {
    const row = document.createElement('div');
    count += 1;
    row.classList.add('component');
    row.dataset.partName = node.name.toLowerCase();
    row.textContent = (depth ? '↳ ' : '') + node.name +
      (node.found || !depth ? '' : ' (not found — upload with assembly)');
    if (!node.found && depth) row.classList.add('missing');
    if (depth) row.classList.add('child');
    parent.appendChild(row);
    for (const child of node.children) add(child, parent, depth + 1);
  };
  add(tree, refs, 0);
  progress.max = Math.max(count, 1);
  return count;
}

function updateConversionProgress(state) {
  const total = Number(progress.max) || 1;
  progress.value = Math.min(state.completed || 0, total);
  const current = state.current
    ? ' "' + state.current + '"' : '';
  stats.textContent = 'Converting component' + current + ' — '
    + (state.completed || 0) + '/' + total + ' complete'
    + ' — step ' + formatDuration(
      performance.now() - activeConversion.phaseStarted)
    + ', total ' + formatDuration(
      performance.now() - activeConversion.started);
  const completed = new Set((state.completed_parts || [])
    .map((part) => part.toLowerCase()));
  const missing = new Set((state.missing_parts || [])
    .map((part) => part.toLowerCase()));
  refs.querySelectorAll('.component').forEach((row) => {
    row.classList.toggle('done', completed.has(row.dataset.partName));
    row.classList.toggle('missing', missing.has(row.dataset.partName));
    row.classList.toggle('active', row.dataset.partName
      === (state.current || '').toLowerCase());
  });
}

async function waitForConversion(jobId) {
  while (true) {
    const response = await fetch('/convert/' + jobId + '/status');
    if (!response.ok) throw new Error('Conversion status unavailable');
    const state = await response.json();
    state.job_id = jobId;
    updateConversionProgress(state);
    if (state.status === 'complete') progress.value = progress.max;
    if (state.status === 'complete' || state.status === 'failed') return state;
    await new Promise((resolve) => setTimeout(resolve, 400));
  }
}
</script>
</body>
</html>
